name: taskflow-monitoring

services:
  prometheus:
    build: ./prometheus
    image: taskflow-prometheus:latest
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - prod-net

  alertmanager:
    build:
      context: ./alertmanager
      args:
        ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:?ALERT_EMAIL_FROM must be set}
        ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?ALERT_EMAIL_TO must be set}
    image: taskflow-alertmanager:latest
    container_name: taskflow-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-secrets:/etc/alertmanager/secrets:ro
    restart: unless-stopped
    networks:
      - prod-net

  grafana:
    build: ./grafana
    image: taskflow-grafana:latest
    container_name: taskflow-grafana
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
    networks:
      - prod-net

volumes:
  alertmanager-secrets:
    name: taskflow-alertmanager-secrets
    external: true

networks:
  
  prod-net:
    name: taskflow-prod-net
    external: true
