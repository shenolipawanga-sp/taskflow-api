groups:
  - name: taskflow-api
    rules:
      - alert: TaskflowApiDown
        expr: up{job="taskflow-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow API is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for over 30 seconds."

      - alert: TaskflowHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="taskflow-api",status=~"5.."}[2m]))
            / clamp_min(sum(rate(http_requests_total{job="taskflow-api"}[2m])), 1e-9) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of requests are failing"
          description: "The 5xx error ratio is {{ $value | humanizePercentage }} over the last 2 minutes."

      - alert: TaskflowSlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="taskflow-api"}[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency is above 500 ms"
          description: "p95 latency is {{ $value | humanizeDuration }}."

      - alert: TaskflowHighMemory
        expr: process_resident_memory_bytes{job="taskflow-api"} > 200 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API memory use is above 200 MB"
          description: "Resident memory is {{ $value | humanize1024 }}B against a 256 MB container limit."
