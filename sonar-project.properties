sonar.projectKey=taskflow-api
sonar.projectName=TaskFlow API
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=coverage/**,reports/**,dist/**,monitoring/**,node_modules/**

sonar.cpd.exclusions=tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint-report.json

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
